<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inventory</title>
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <div id = "inventory">
            <h1>Your inventory</h1>
            <div class = "item" id = "add-button"> + New item</div>
        </div>
        <dialog id = "item-editor">
            <div class = "dialog">
            <h2>Add item info...</h2>
            <form id = "item-form" method="dialog">
                <label for="name">Item Name:</label>
                <input type="text" id="name" name="name">
                <br>
                <label for="quantity">Quantity:</label>
                <input type="number" id="quantity" name="quantity">
                <br>
                <label for="description">Description:</label>
                <textarea id="description" name="description"></textarea>
                <span id = "new-properties"></span>
                <button type = "submit">Save</button>
                <br>
                <button id = "rest" type="reset">Cancel</button>
            </form>
            <br>
            <div id = "new-input">
                <button id = "new-property">New property</button>
            </div>
            </div>
        </dialog>
        <dialog id = "item-viewer">
            <div id = "item-info" class = "dialog">
            </div>
        </dialog>
        <script src="./main.js"></script>
        </body>
</html>
