<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inventory</title>
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <div id = "inventory"> <!-- Div to hold all item elements -->
            <h1>Your inventory</h1>
            <div class = "item" id = "add-button"> + New item</div>
            <!-- New items go here -->
        </div>
        <dialog id = "item-creator"> <!-- Item creator Dialog -->
            <div class = "dialog">
            <h2>Add item info...</h2>
            <h4>(Any blank properties will be ignored)</h4>
            <form id = "item-form" method="dialog">
                <label for="Name">Item Name:</label>
                <input type="text" id="Name" name="Name" required>
                <br>
                <label for="Quantity">Quantity:</label>
                <input type="number" id="Quantity" name="Quantity">
                <br>
                <label for="Description">Description:</label>
                <textarea id="Description" name="Description"></textarea>
                <span id = "new-properties"><!--User created properties go here --></span>
                <button type = "submit">Save</button>
                <button id = "rest" type="reset">Cancel</button>
            </form>
            <br>
            <div id = "new-input">
                <button id = "new-property">New property</button>
            </div>
            </div>
        </dialog>
        <dialog id = "item-viewer"> <!-- Item veiwer dialog -->
            <div id = "item-info" class = "dialog">
                <!-- Item properties go here-->
            </div>
        </dialog>
        <dialog id = "item-editor"> <!-- Item editor dialog -->
            <div id = "editor" class = "dialog">
                <!-- Item properties to edit go here -->
            </div>
        </dialog>
        <dialog id = "delete"> <!-- Pop-up for user to confirm their delete -->
            <div id = "delete-div" class = "dialog">
                <span id = "delete-text"></span>
                <br>
                <button id = "confirm-delete">Delete item</button>
                <br>
                <button id ="cancel-delete">Cancel</button>
            </div>
        </dialog>
        <script src="./main.js"></script>
        </body>
</html>
